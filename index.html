<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jules AI Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Jules AI Command Center</h1>
            <p id="ai-description"></p>
        </header>

        <main class="main-layout">
            <aside class="sidebar">
                <h2>Core Operating Principles</h2>
                <div id="principles-container">
                    <!-- Core principles will be loaded here by JavaScript -->
                </div>
            </aside>

            <section class="content">
                <div class="command-panel-container">
                    <h2>Human Operator Commands</h2>
                    <div id="command-panel">
                        <!-- Command buttons will be loaded here by JavaScript -->
                    </div>
                </div>

                <div class="output-log-container">
                    <h2>System Log</h2>
                    <div id="output-log" class="output-log">
                        <p class="log-entry system">Welcome, Architect. System is online.</p>
                        <!-- Log entries will be added here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="mockApi.js"></script>
    <script src="script.js"></script>
</body>
</html>
